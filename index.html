.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px;margin-bottom:6px;border-bottom:1px solid rgba(201,162,74,.22)}.brand img{border-radius:7px;flex:none;box-shadow:0 2px 10px rgba(0,0,0,.35)}.brand b{display:block;font-size:16px;letter-spacing:.5px}.brand small{display:block;font-size:10.5px;color:#9aa1a9;letter-spacing:.5px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{background:none;border:0;color:#c5c9ce;text-align:left;padding:8px 10px;border-radius:4px;border-left:3px solid transparent}
nav button.on{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--gb);font-weight:600}
.who{margin-top:auto;font-size:12.5px;color:#9aa1a9;padding:0 8px}
main{padding:22px;max-width:1120px;width:100%}
.crumb{font-size:13px;color:var(--mut);margin-bottom:8px}.crumb button{background:none;border:0;color:var(--gold);padding:0}
h2{font-size:21px;margin:0 0 4px}h3{font-size:15px;margin:24px 0 10px}
.sub{color:var(--mut);margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.k{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px 14px;text-align:left;width:100%}
.k span{display:block;font-size:12.5px;color:var(--mut)}.k b{font-size:20px;font-variant-numeric:tabular-nums}.k small{display:block;font-size:12px;color:var(--mut)}
.k.bad b{color:var(--bad)}.k.warn b{color:var(--warn)}.k.ok b{color:var(--ok)}
.alerts{display:grid;gap:6px}
.al{background:var(--card);border-radius:0 6px 6px 0;padding:9px 14px;border:1px solid var(--line);border-left:4px solid;text-align:left;width:100%}
.al.bad{border-left-color:var(--bad)}.al.warn{border-left-color:var(--warn)}.al.ok{border-left-color:var(--ok)}
.b{background:var(--gb);color:#1b1d20;border:0;border-radius:4px;padding:8px 16px;font-weight:600}
.b2{background:none;border:1px solid var(--line);border-radius:4px;padding:8px 16px}
.b2.bad{border-color:var(--bad);color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:560px}
th,td{padding:9px 12px;text-align:right;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}th{font-size:12.5px;color:var(--mut);font-weight:500}
tr.r{cursor:pointer}tr.r:hover{background:var(--bg)}
.tag{display:inline-block;font-size:12px;padding:0 9px;border-radius:10px;border:1px solid}
.tag.bad{color:var(--bad)}.tag.warn{color:var(--warn)}.tag.ok{color:var(--ok)}.tag.mut{color:var(--mut)}
.bars{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 14px}
.br{display:grid;grid-template-columns:minmax(100px,190px) 1fr 70px;gap:10px;align-items:center;padding:6px 0;font-size:13.5px;background:none;border:0;width:100%;text-align:left}
button.br{cursor:pointer}
.tr{position:relative;height:12px;background:var(--bg);border-radius:6px}
.tr i{position:absolute;top:0;bottom:0;left:0;border-radius:6px;background:var(--gb)}
.tr i.bad{background:var(--bad)}.tr i.warn{background:var(--warn)}.tr i.ok{background:var(--ok)}
.tr u{position:absolute;top:-3px;bottom:-3px;border-left:1px dashed var(--mut)}
.dre td.n{color:var(--bad)}.dre tr.t td{font-weight:700;border-top:2px solid var(--ink)}
.fm{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:2px 14px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 16px 16px}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
input,select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.note{font-size:12.5px;color:var(--mut);margin-top:22px}
.mes{max-width:180px}.sel{padding:0 8px 10px}.sel select{background:#1e2125;color:#fff;border-color:#454b52}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));min-width:640px}.ch{padding:6px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line)}.cd{min-height:88px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.cd b{font-size:12px;color:var(--mut)}.cd.hj{background:var(--bg)}.cd.hj b{color:var(--gold)}.cd small{font-size:11px;color:var(--mut)}
.ev{display:block;width:100%;text-align:left;font-size:11.5px;border:0;border-left:3px solid;background:var(--bg);border-radius:3px;padding:1px 4px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ev.s{border-left-color:var(--gb)}.ev.p{border-left-color:var(--warn)}.ev.i{border-left-color:var(--mut)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr));gap:14px;margin-top:14px}.pn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 16px 14px;min-width:0}.pn h3{margin:12px 0 8px}
.hg{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}.hero{border-top:4px solid var(--gb)}.hero b{font-size:28px}.hero.ok{border-top-color:var(--ok)}.hero.warn{border-top-color:var(--warn)}.hero.bad{border-top-color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:8px}.acts .b2{background:var(--side);color:#fff;border:1px solid var(--gb)}
svg text{font-size:11px;fill:var(--mut)}svg text.tok{fill:var(--ok);font-weight:600}svg text.twarn{fill:var(--warn);font-weight:600}svg text.tbad{fill:var(--bad);font-weight:600}svg .c1{fill:var(--gb)}svg .c2{fill:var(--mut);opacity:.75}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--mut);margin-top:6px}.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}.sw.c1{background:var(--gb)}.sw.c2{background:var(--mut)}
.dn{display:flex;gap:18px;align-items:center;flex-wrap:wrap}.donut{width:150px;height:150px;border-radius:50%;flex:none;-webkit-mask:radial-gradient(circle,transparent 46px,#000 47px);mask:radial-gradient(circle,transparent 46px,#000 47px)}
.lg{flex:1;min-width:180px;font-size:13.5px}.lg div{display:flex;align-items:center;padding:2px 0}.lg b{margin-left:auto;padding-left:10px;font-variant-numeric:tabular-nums}
.seg{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:6px 0 10px}.seg i{display:block;height:100%}
.ml{display:flex;gap:12px;background:none;border:0;border-bottom:1px solid var(--line);width:100%;padding:7px 0;text-align:left}.ml span:first-child{color:var(--gold);font-variant-numeric:tabular-nums;min-width:82px}
html,body{overflow-x:hidden;max-width:100%}

/* ===== V2 — camada executiva ===== */
:root{
  --accent:#d4af37;
  --accent-soft:rgba(212,175,55,.12);
  --success:#35b779;
  --danger:#ef5350;
  --warning:#f5a623;
  --info:#4ea1ff;
}
body{background:var(--bg,#0b0d10);transition:background .2s,color .2s}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.kpi,.card,.panel,.box,.metric{transition:transform .15s,box-shadow .15s,border-color .15s}
.kpi:hover,.card:hover,.panel:hover,.box:hover,.metric:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.section-head h2,.section-head h3{margin:0}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}
.badge.success{background:rgba(53,183,121,.13);color:var(--success)}
.badge.warning{background:rgba(245,166,35,.13);color:var(--warning)}
.badge.danger{background:rgba(239,83,80,.13);color:var(--danger)}
.badge.info{background:rgba(78,161,255,.13);color:var(--info)}
.muted{opacity:.68}
.empty-state{text-align:center;padding:28px 16px;opacity:.68}
.alert-strip{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid rgba(212,175,55,.28);background:var(--accent-soft);border-radius:10px;margin-bottom:14px}
.quick-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.quick-actions button{padding:12px;border:1px solid rgba(127,127,127,.22);background:transparent;border-radius:10px;text-align:left}
.quick-actions button:hover{border-color:var(--accent)}
@media(max-width:900px){.quick-actions{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.quick-actions{grid-template-columns:1fr}}

.axis-login-card {
    width: 100%;
    max-width: 420px;

    padding: 38px;

    background:
        linear-gradient(
            145deg,
            #111821,
            #0a0f15
        );

    border: 1px solid rgba(32,164,255,.18);

    border-radius: 18px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.55),
        0 0 40px rgba(32,164,255,.06);
}

.axis-login-logo {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 35px;
}

.axis-login-logo strong {
    display: block;

    font-size: 25px;
    letter-spacing: 6px;
}

.axis-login-logo small {
    display: block;

    margin-top: 5px;

    color: #7f8b99;

    font-size: 9px;
    letter-spacing: 2px;
}

.axis-login-mark{width:48px;height:48px;border-radius:12px;display:block;box-shadow:0 4px 18px rgba(0,0,0,.4)}

.axis-login-title h1 {
    margin: 0;

    font-size: 23px;
}

.axis-login-title p {
    margin: 7px 0 25px;

    color: #8e9baa;

    font-size: 13px;
}

#loginForm label {
    display: block;

    margin:
        16px 0 7px;

    font-size: 12px;

    color: #aab4c0;
}

#loginForm input {
    width: 100%;

    box-sizing: border-box;

    padding: 13px 14px;

    border-radius: 9px;

    background: #080d13;

    border: 1px solid rgba(255,255,255,.1);

    color: white;

    outline: none;
}

#loginForm input:focus {
    border-color: #20a4ff;

    box-shadow:
        0 0 0 3px rgba(32,164,255,.08);
}

#loginButton {
    width: 100%;

    margin-top: 25px;

    padding: 13px;

    border: none;

    border-radius: 9px;

    background:
        linear-gradient(
            135deg,
            #20a4ff,
            #0b72c9
        );

    color: white;

    font-weight: 800;

    letter-spacing: 1px;

    cursor: pointer;
}

#loginButton:hover {
    box-shadow:
        0 0 25px rgba(32,164,255,.25);
}

#loginError {
    min-height: 20px;

    margin-top: 14px;

    color: #ef5350;

    font-size: 12px;

    text-align: center;
}

.axis-login-footer {
    margin-top: 28px;

    padding-top: 18px;

    border-top:
        1px solid rgba(255,255,255,.06);

    color: #596574;

    text-align: center;

    font-size: 9px;

    letter-spacing: 2px;
}
body:not(.axis-authenticated) .app{display:none}
.who b{color:#fff}.who button{margin-top:8px;background:none;border:1px solid #555b63;color:#e8e9eb;border-radius:4px;padding:3px 10px}
.ng{color:#7f8b99;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;padding:10px 10px 2px}nav button.sub2{padding-left:20px}
@media (max-width:780px){.ng{display:none}nav button.sub2{padding-left:10px}}
.resumo .k{padding:16px 16px}.resumo .k span{font-size:13.5px}.resumo .k b{font-size:26px}
.resumo h3{font-size:16px}
.resumo .br{padding:9px 0;font-size:15px}.resumo .tr{height:16px}
.resumo .al{font-size:14.5px;padding:11px 14px}
.resumo .hero b{font-size:32px}
.bcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:4px}
.bcard{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gb);border-radius:8px;padding:14px 16px;text-align:left}
.bcard b{display:block;font-size:15px;margin-bottom:4px}
.bcard span{display:block;font-size:12.5px;color:var(--mut)}
.bacc{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.bacc summary{cursor:pointer;list-style:none;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:10px}
.bacc summary::-webkit-details-marker{display:none}
.bacc summary span{font-weight:500;font-size:13px;color:var(--mut);white-space:nowrap}
.bacc[open] summary{border-bottom:1px solid var(--line)}
.bacc .tw{border:0;border-radius:0}

<script>
/* ===== AXIS — autenticação e camada de dados (Supabase) ===== */
const SUPABASE_URL = 'https://hedbzwqacopbjijuymzs.supabase.co';           /* sem /rest/v1/ */
const SUPABASE_ANON_KEY = 'sb_publishable_FLSlRu1aJzD44TFZOetk3Q_oChFBsaS'; /* chave pública; nunca use a service_role aqui */
const JURIDICO_PERFIS = ['diretor', 'administrador', 'admin', 'juridico', 'jurídico'];

/* O sistema espera esta promessa; ela só resolve depois do login */
window.AXIS_READY = new Promise(function (resolve) { window.AXIS_START = resolve; });
window.JOK = function () {
  var p = window.AXIS_USER ? String(window.AXIS_USER.perfil || '').toLowerCase() : '';
  return JURIDICO_PERFIS.indexOf(p) >= 0;
};

window.FOK = function () {
  var p = window.AXIS_USER ? String(window.AXIS_USER.perfil || '').toLowerCase() : '';
  return ['financeiro', 'diretor', 'administrador', 'admin'].indexOf(p) >= 0;
};

/* Perfil "conselho": acesso somente de leitura a um resumo para a diretoria — sem contratos, licitações,
   CRM, documentos, financeiro completo ou jurídico completo, e sem nenhum botão de cadastro/edição/exclusão. */
window.BOARD = function () {
  var p = window.AXIS_USER ? String(window.AXIS_USER.perfil || '').toLowerCase() : '';
  return p === 'conselho';
};

/* Camada de dados: guarda tudo na tabela "registros" (ver axis-supabase-setup.sql) */
function axisCriarDB(sb) {
  var T = 'registros', subs = [], timer = null;
  function unir(a, b) {
    var o = Object.assign({}, a);
    Object.keys(b).forEach(function (k) {
      var v = b[k], w = o[k];
      o[k] = v && typeof v === 'object' && !Array.isArray(v) && w && typeof w === 'object' && !Array.isArray(w) ? unir(w, v) : v;
    });
    return o;
  }
  async function lista(col) {
    var r = await sb.from(T).select('id,dados').eq('colecao', col).order('criado_em', { ascending: true });
    if (r.error) throw r.error;
    return r.data || [];
  }
  async function um(col, id) {
    var r = await sb.from(T).select('id,dados').eq('colecao', col).eq('id', id).maybeSingle();
    if (r.error) throw r.error;
    return r.data;
  }
  function avisar(col) { subs.forEach(function (s) { if (!col || s.col === col) s.run(); }); }
  try {
    sb.channel('axis-registros').on('postgres_changes', { event: '*', schema: 'public', table: T }, function () {
      clearTimeout(timer); timer = setTimeout(function () { avisar(); }, 300);
    }).subscribe();
  } catch (e) { /* sem tempo real: o sistema atualiza após cada gravação */ }
  return {
    collection: function (col) {
      return {
        onSnapshot: function (cb, err) {
          subs.push({ col: col, run: async function () {
            try { cb({ docs: (await lista(col)).map(function (x) { return { id: x.id, data: function () { return x.dados; } }; }) }); }
            catch (e) { console.error(col, e); if (err) err(e); }
          } });
          subs[subs.length - 1].run();
        },
        add: async function (d) {
          var r = await sb.from(T).insert({ colecao: col, dados: d }).select('id').single();
          if (r.error) throw r.error;
          avisar(col);
          return { id: r.data.id };
        }
      };
    },
    doc: function (path) {
      var col = path.split('/')[0], id = path.split('/')[1];
      return {
        onSnapshot: function (cb, err) {
          subs.push({ col: col, run: async function () {
            try { var r = await um(col, id); cb({ exists: !!r, data: function () { return r ? r.dados : {}; } }); }
            catch (e) { console.error(path, e); if (err) err(e); }
          } });
          subs[subs.length - 1].run();
        },
        update: async function (d) {
          var r = await um(col, id);
          if (!r) throw new Error('Registro não encontrado');
          var u = await sb.from(T).update({ dados: unir(r.dados, d), atualizado_em: new Date().toISOString() }).eq('colecao', col).eq('id', id);
          if (u.error) throw u.error;
          avisar(col);
        },
        set: async function (d) {
          var u = await sb.from(T).upsert({ colecao: col, id: id, dados: d, atualizado_em: new Date().toISOString() }, { onConflict: 'colecao,id' });
          if (u.error) throw u.error;
          avisar(col);
        },
        delete: async function () {
          var u = await sb.from(T).delete().eq('colecao', col).eq('id', id);
          if (u.error) throw u.error;
          avisar(col);
        }
      };
    },
    storage: {
      upload: async function (file, opt) {
        var nome = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Date.now())) + '-' + file.name.replace(/[^\w.\-]+/g, '_');
        var r = await sb.storage.from('documentos').upload(nome, file, { contentType: (opt && opt.type) || file.type });

function loginMsg(t) { document.getElementById('loginError').textContent = t || ''; }

async function carregarUsuario(user) {
  var motivo = '', u = null;
  /* 1) pelo id do login; 2) pelo e-mail; 3) pela função axis_meu_usuario() do arquivo SQL */
  var r = await axisSb.from('usuarios').select('*').eq('id', user.id).maybeSingle();
  if (r.error) motivo = 'Erro ao consultar a tabela "usuarios": ' + r.error.message;
  u = r.data;
  if (!u && user.email) {
    var r2 = await axisSb.from('usuarios').select('*').eq('email', user.email).limit(1);
    if (!r2.error && r2.data && r2.data.length) u = r2.data[0];
  }
  if (!u) {
    var r3 = await axisSb.rpc('axis_meu_usuario');
    if (!r3.error && r3.data && r3.data.length) u = r3.data[0];
  }
  if (!u) {
    console.error('AXIS: usuário não encontrado', user.id, user.email, r.error);
    loginMsg(motivo || 'Login correto, mas não há cadastro em "usuarios" para este usuário (id ' + user.id + '). Confira se o id da tabela é igual ao de Authentication > Users e se o SQL de configuração foi executado.');
    await axisSb.auth.signOut();
    return false;
  }
  if (u.ativo === false) {
    loginMsg('Este usuário está desativado.');
    await axisSb.auth.signOut();
    return false;
  }
  window.AXIS_USER = u;
  abrirSistema(u);
  return true;
}

  document.body.classList.add('axis-authenticated');
  var mm = document.getElementById('mmenu'), bd = document.getElementById('backdrop');
  if (mm) mm.onclick = function () { document.body.classList.toggle('nav-open'); };
  if (bd) bd.onclick = function () { document.body.classList.remove('nav-open'); };
  var box = document.getElementById('whoBox');
  box.innerHTML = '<b></b><br><span></span><br><button type="button" id="logoutBtn">Sair</button>';
  box.querySelector('b').textContent = u.nome || u.email;
  box.querySelector('span').textContent = u.perfil || '';
  document.getElementById('logoutBtn').onclick = logoutAXIS;
  if (!axisIniciado) { axisIniciado = true; window.AXIS_START(axisCriarDB(axisSb)); }
}

async function logoutAXIS() {
  try { await axisSb.auth.signOut(); } catch (e) {}
  window.AXIS_USER = null;
  location.reload();
}

async function verificarSessao() {
  if (!axisSb) { document.getElementById('loginScreen').style.display = 'flex'; loginMsg('Não foi possível carregar o Supabase. Verifique a conexão e recarregue a página.'); return; }
  var s = await axisSb.auth.getSession();
  if (!s.data.session) { document.getElementById('loginScreen').style.display = 'flex'; return; }
  await carregarUsuario(s.data.session.user);
}

  ev.preventDefault();
  var btn = document.getElementById('loginButton');
  loginMsg('');
  if (!axisSb) return loginMsg('Não foi possível carregar o Supabase. Verifique a conexão e recarregue a página.');
  btn.disabled = true; btn.textContent = 'ENTRANDO...';

    loginMsg('E-mail ou senha inválidos.');

});

(function(){

  var fk=function(v){var a=Math.abs(v),s=a>=1e6?(a/1e6).toFixed(1).replace('.',',')+' mi':a>=1e3?Math.round(a/1e3)+' mil':String(Math.round(a));return(v<0?'-':'')+s};
  var agora=function(){return new Date().toLocaleString('pt-BR')};
  var PH=function(t,s){return'<div class="ph"><b>AXIS · '+t+'</b><span>'+s+' · emitido em '+agora()+'</span></div>'};
  var TIP=function(a){return' data-tip="'+E(a.join('|'))+'"'};
  var LEG='<div class="leg"><span><i class="sw c1"></i>Receita</span><span><i class="sw c2"></i>Custos</span><span><i class="sw c3"></i>Lucro (receita − custos)</span></div><p class="hint">Passe o mouse (ou toque) nas barras para ver os valores.</p>';
  var mesesN=function(k){var ms=[];for(var i=1-k;i<=0;i++)ms.push(SM(mes,i));return ms};

  /* receita, custos e lucro por mês: barras + linha do lucro; cada mês mostra os valores ao passar o mouse */
  function gEvo(ms,list){
    var d=ms.map(function(m){var rc=0,cs=0,k=0;list.forEach(function(x){var r=calc(x,m);if(r){rc+=r.rec;cs+=r.cost;k++}});return{m:m,rec:rc,cost:cs,res:rc-cs,k:k}});
    if(!d.some(function(x){return x.k}))return'<p class="sub">Sem lançamentos no período.</p>';
    var W=640,H=270,L=56,Rr=12,T=14,B=34,pw=W-L-Rr,ph=H-T-B;
    var mx=Math.max.apply(null,d.map(function(x){return Math.max(x.rec,x.cost)}).concat(1))*1.08;
    var mn=Math.min.apply(null,d.map(function(x){return x.k?x.res:0}).concat(0));if(mn<0)mn*=1.15;
    var Y=function(v){return T+(mx-v)/(mx-mn)*ph},o='';
    for(var g=0;g<=4;g++){var v=mn+(mx-mn)*g/4,y=Y(v);o+='<line x1="'+L+'" y1="'+y+'" x2="'+(W-Rr)+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+fk(v)+'</text>'}
    var sl=pw/d.length,bw=Math.min(24,sl*.3),pts=[],y0=Y(0),hits='';
    d.forEach(function(x,i){var cx=L+sl*i+sl/2;
      if(x.k){o+='<rect class="c1" x="'+(cx-bw-1)+'" y="'+Y(x.rec)+'" width="'+bw+'" height="'+Math.max(0,y0-Y(x.rec))+'" rx="2"/><rect class="c2" x="'+(cx+1)+'" y="'+Y(x.cost)+'" width="'+bw+'" height="'+Math.max(0,y0-Y(x.cost))+'" rx="2"/>';pts.push([cx,Y(x.res),x.res])}
      o+='<text x="'+cx+'" y="'+(H-14)+'" text-anchor="middle">'+x.m.slice(5)+'/'+x.m.slice(2,4)+'</text>';
      hits+='<rect class="hit" x="'+(L+sl*i)+'" y="'+T+'" width="'+sl+'" height="'+ph+'"'+TIP(x.k?[ML(x.m),'Receita: '+R(x.rec),'Custos: '+R(x.cost),'Lucro: '+R(x.res),'Margem: '+P(x.rec?x.res/x.rec*100:0)]:[ML(x.m),'Sem lançamento'])+'/>'});
    o+='<line x1="'+L+'" y1="'+y0+'" x2="'+(W-Rr)+'" y2="'+y0+'" stroke="var(--mut)"/>';
    if(pts.length)o+='<polyline class="gl" points="'+pts.map(function(p){return p[0]+','+p[1]}).join(' ')+'"/>'+pts.map(function(p){return'<circle class="'+(p[2]<0?'gb':'gk')+'" cx="'+p[0]+'" cy="'+p[1]+'" r="3.5"/>'}).join('');
    return'<svg class="gsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Receita, custos e lucro por mês">'+o+hits+'</svg>'+LEG}

  /* lucro em R$ por contrato; clicar numa linha abre o contrato */
  function gLucro(rows){
    if(!rows.length)return'<p class="sub">Sem lançamentos no período.</p>';
    var Lr=rows.slice().sort(function(a,b){return b.res-a.res}),W=640,lb=170,rb=95,H=14+Lr.length*30;
    var mn=Math.min(0,Math.min.apply(null,Lr.map(function(r){return r.res}))),mx=Math.max(0,Math.max.apply(null,Lr.map(function(r){return r.res})));if(mx==mn)mx=mn+1;
    var pw=W-lb-rb,X=function(v){return lb+(v-mn)/(mx-mn)*pw},z=X(0),o='',hits='';
    Lr.forEach(function(r,i){var y=8+i*30,xe=X(r.res),x0=Math.min(z,xe),w=Math.max(2,Math.abs(xe-z)),pos=r.res>=0,nm=r.nome.length>24?r.nome.slice(0,23)+'…':r.nome;
      o+='<text x="'+(lb-8)+'" y="'+(y+14)+'" text-anchor="end">'+E(nm)+'</text><rect class="'+(pos?'gk':'gb')+'" x="'+x0+'" y="'+y+'" width="'+w+'" height="20" rx="2"/>'+
         '<text class="'+(pos?'tok':'tbad')+'" x="'+(pos?x0+w+6:z+6)+'" y="'+(y+14)+'">'+R(r.res)+'</text>';
      hits+='<rect class="hit" x="0" y="'+(y-3)+'" width="'+W+'" height="26"'+(r.id?' data-a="go" data-p="det:'+r.id+'"':'')+TIP([r.nome,'Receita: '+R(r.rec),'Custos: '+R(r.cost),'Lucro: '+R(r.res),'Margem: '+P(r.m)].concat(r.id?['Clique para abrir o contrato']:[]))+'/>'});
    o+='<line x1="'+z+'" y1="2" x2="'+z+'" y2="'+(H-2)+'" stroke="var(--mut)"/>';
    return'<svg class="gsvg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Lucro por contrato">'+o+hits+'</svg><p class="hint">Clique em uma linha para abrir o contrato.</p>'}

  /* composição dos custos: rosca interativa + legenda com % e R$ */
  function gCustos(t){
    var it=KS.map(function(k){return[LB[k],t[k]||0]}).filter(function(q){return q[1]>0}).sort(function(a,b){return b[1]-a[1]}),tot=S(it,function(q){return q[1]});
    if(!tot)return'<p class="sub">Nenhum custo lançado no período.</p>';
    var tp=it.slice(0,5),rs=tot-S(tp,function(q){return q[1]});if(rs>0)tp.push(['Demais itens',rs]);
    var cx=80,cy=80,Ro=72,Ri=44,a0=-Math.PI/2,sv='',lg='';
    tp.forEach(function(q,i){var a1=a0+Math.min(q[1]/tot*2*Math.PI,2*Math.PI-1e-4),lf=a1-a0>Math.PI?1:0,
      p=function(r,a){return(cx+r*Math.cos(a)).toFixed(2)+' '+(cy+r*Math.sin(a)).toFixed(2)};
      sv+='<path class="sl" style="fill:'+PAL[i]+'" d="M'+p(Ro,a0)+' A'+Ro+' '+Ro+' 0 '+lf+' 1 '+p(Ro,a1)+' L'+p(Ri,a1)+' A'+Ri+' '+Ri+' 0 '+lf+' 0 '+p(Ri,a0)+' Z"'+TIP([q[0],R(q[1]),P(q[1]/tot*100)+' dos custos'])+'/>';
      lg+='<div><i class="sw" style="background:'+PAL[i]+'"></i>'+E(q[0])+'<b>'+P(q[1]/tot*100)+' · '+R(q[1])+'</b></div>';a0=a1});
    return'<div class="dn"><svg viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="Composição dos custos">'+sv+'<text class="ctr" x="80" y="78" text-anchor="middle">'+fk(tot)+'</text><text x="80" y="94" text-anchor="middle">custos</text></svg><div class="lg">'+lg+'</div></div><p class="note" style="margin:8px 0 0">Total de custos: '+R(tot)+'</p>'}

  function somar(x,ms){var a={x:x,id:x.id,nome:x.cliente||'',rec:0,cost:0,nm:0,c:{}};ms.forEach(function(m){var r=calc(x,m);if(r){a.rec+=r.rec;a.cost+=r.cost;a.nm++;var c=((x.months||{})[m]||{}).c||{};KS.forEach(function(k){a.c[k]=(a.c[k]||0)+n(c[k])})}});a.res=a.rec-a.cost;a.m=a.rec?a.res/a.rec*100:0;return a}
  var BTN=function(id){return'<button class="b2" data-a="pdfc" data-p="'+id+'">PDF</button>'};
  var SELP=function(id,v,l){return'<select id="'+id+'" style="width:auto">'+l.map(function(k){return'<option value="'+k+'"'+(k==v?' selected':'')+'>'+(k==1?'Só o mês':'Últimos '+k+' meses')+'</option>'}).join('')+'</select>'};

  /* ----- página: Rentabilidade por contrato ----- */
  function rel(){
    var ms=mesesN(RP),rows=CT.map(function(x){return somar(x,ms)}).filter(function(a){return a.nm}),
        sub='Período de '+ML(ms[0])+' a '+ML(mes)+' · '+(emp||'Grupo consolidado'),
        h=PH('Rentabilidade por contrato',sub)+CR('','Rentabilidade por contrato')+'<h2>Rentabilidade por contrato</h2><p class="sub">'+sub+'. Custos e lucro somados dos lançamentos mensais.</p>'+
        '<div class="row"><label for="ms" style="margin:0">Competência final</label><input class="mes" id="ms" type="month" value="'+mes+'" data-m="1">'+
        '<label for="rp" style="margin:0">Período</label>'+SELP('rp',RP,[1,3,6,12])+
        '<button class="b" data-a="pdf" data-p="AXIS-Rentabilidade-'+mes+'">Exportar PDF do relatório</button>'+(rows.length?'<button class="b2" data-a="pdfall">PDF de cada contrato (1 por página)</button>':'')+'</div>';
    if(!rows.length)return h+'<p class="sub">Nenhum contrato com lançamento neste período.</p>';
    var rec=S(rows,function(a){return a.rec}),cost=S(rows,function(a){return a.cost}),res=rec-cost,m=rec?res/rec*100:0,s=sem(m),
        melhor=rows.slice().sort(function(a,b){return b.res-a.res})[0],pior=rows.slice().sort(function(a,b){return a.m-b.m})[0],tc={};
    rows.forEach(function(a){KS.forEach(function(k){tc[k]=(tc[k]||0)+(a.c[k]||0)})});
    h+='<div class="grid hg">'+HK('Receita',R(rec),RP+(RP==1?' mês':' meses'))+HK('Custos',R(cost),P(rec?cost/rec*100:0)+' da receita')+HK('Lucro',R(res),s[0],s[1])+HK('Margem',P(m),'média ponderada pela receita',s[1])+'</div>'+
       '<div class="grid" style="margin-top:10px">'+K('Maior lucro',E(melhor.nome),R(melhor.res)+' · margem '+P(melhor.m))+K('Menor margem',E(pior.nome),P(pior.m)+' · lucro '+R(pior.res),sem(pior.m)[1])+K('Contratos no relatório',rows.length,CT.length-rows.length?(CT.length-rows.length)+' sem lançamento no período':'todos com lançamento')+'</div>';
    h+='<div class="two">'+PN('Receita, custos e lucro por mês',gEvo(ms,CT))+PN('Lucro por contrato (R$)',gLucro(rows))+PN('Composição dos custos',gCustos(tc))+
       PN('Margem por contrato','<div class="bars" style="border:0;padding:0">'+rows.slice().sort(function(a,b){return b.m-a.m}).map(function(a){return BR(E(a.nome),(a.m+10)/40*100,P(a.m),sem(a.m)[1],'det:'+a.x.id,(CF.mv+10)/40*100)}).join('')+'</div>')+'</div>';
    h+='<h3>Demonstrativo consolidado</h3>'+TB(['Contrato','Receita','Custos','Lucro','Margem','Situação',''],rows.slice().sort(function(a,b){return b.res-a.res}).map(function(a){
      return'<tr class="r" data-a="go" data-p="det:'+a.x.id+'"><td>'+E(a.nome)+EL(a.x)+'</td><td>'+R(a.rec)+'</td><td>'+R(a.cost)+'</td><td'+(a.res<0?' style="color:var(--bad)"':'')+'>'+R(a.res)+'</td><td>'+P(a.m)+'</td><td>'+TG(sem(a.m))+'</td><td class="np">'+BTN(a.x.id)+'</td></tr>'}).concat(['<tr class="t"><td>Total</td><td>'+R(rec)+'</td><td>'+R(cost)+'</td><td>'+R(res)+'</td><td>'+P(m)+'</td><td>'+TG(s)+'</td><td class="np"></td></tr>'])).replace('<div class="tw">','<div class="tw dre">');
    return h}

  /* ----- gráficos na página de cada contrato ----- */
  function detGraficos(x){
    var ms=mesesN(RC),a=somar(x,ms),r=calc(x),c=r?((x.months||{})[mes]||{}).c||{}:{},t={};KS.forEach(function(k){t[k]=n(c[k])});
    var h='<h3>Custos e lucro do contrato</h3><div class="row"><label for="rc" style="margin:0">Gráfico dos</label>'+SELP('rc',RC,[6,12,24]).replace(/Últimos (\d+) meses/g,'Últimos $1 meses')+'<button class="b" data-a="pdfc" data-p="'+x.id+'">Exportar PDF deste contrato</button></div>';
    if(!a.nm)return h+'<p class="sub">Lance a receita e os custos de algum mês para ver os gráficos.</p>';
    h+='<div class="grid">'+K('Receita ('+RC+' meses)',R(a.rec),a.nm+' mês(es) lançado(s)')+K('Custos ('+RC+' meses)',R(a.cost),P(a.rec?a.cost/a.rec*100:0)+' da receita')+K('Lucro ('+RC+' meses)',R(a.res),'margem '+P(a.m),sem(a.m)[1])+(x.valor&&r?K('Faturado / contratado em '+ML(mes),P(r.rec/x.valor*100),R(r.rec)+' de '+R(x.valor),r.rec<x.valor*.98?'warn':''):'')+'</div>'+
       '<div class="two">'+PN('Receita, custos e lucro ('+RC+' meses)',gEvo(ms,[x]))+PN('Custos de '+ML(mes)+' por item',gCustos(t))+'</div>';
    return h}

  /* ----- relatório em PDF de um contrato (página própria, sem formulários) ----- */
  function contratoRel(x){
    var ms=mesesN(RC),a=somar(x,ms),r=calc(x),L=(x.months||{})[mes]||{},c=L.c||{},s=r?sem(r.m):null,d=x.fim?days(x.fim):null,t={},hs=Object.keys(x.months||{}).sort().reverse();KS.forEach(function(k){t[k]=n(c[k])});
    var h='<section class="rp">'+PH('Relatório do contrato',E(x.cliente)+' · competência '+ML(mes))+'<h2>'+E(x.cliente)+' '+(s?TG(s):'')+'</h2><p class="sub">'+E(x.tipo||'')+' · '+E(x.seg||'')+(x.num?' · contrato nº '+E(x.num):'')+(x.cnpj?' · CNPJ '+E(x.cnpj):'')+(x.sup?' · supervisor: '+E(x.sup):'')+(x.emp?' · '+E(x.emp):'')+'</p>'+
      '<div class="grid">'+K('Valor mensal contratado',R(x.valor))+K('Postos',n(x.postos))+K('Colaboradores previstos',n(x.fun),'Efetivos em '+ML(mes)+': '+(r&&r.alo!=null?r.alo:'não informado'))+K('Vigência',DT(x.ini)+' a '+DT(x.fim),d!=null&&d<=90?(d<0?'vencido':'vence em '+d+' dias'):'')+'</div>';
    if(r)h+='<h3>Resultado de '+ML(mes)+'</h3><div class="grid hg">'+HK('Receita',R(r.rec),x.valor?P(r.rec/x.valor*100)+' do valor contratado':'')+HK('Custos',R(r.cost),P(r.rec?r.cost/r.rec*100:0)+' da receita')+HK('Lucro',R(r.res),s[0],s[1])+HK('Margem',P(r.m),s[0],s[1])+'</div>';
    else h+='<p class="sub">Sem lançamento em '+ML(mes)+'.</p>';
    if(hs.length)h+='<h3>Histórico</h3>'+TB(['Competência','Receita','Custos','Resultado','Margem'],hs.map(function(m){var q=calc(x,m);return'<tr><td>'+ML(m)+'</td><td>'+R(q.rec)+'</td><td>'+R(q.cost)+'</td><td'+(q.res<0?' style="color:var(--bad)"':'')+'>'+R(q.res)+'</td><td>'+P(q.m)+'</td></tr>'}));
    if(a.nm)h+='<h3>Acumulado dos últimos '+RC+' meses</h3><div class="grid">'+K('Receita',R(a.rec),a.nm+' mês(es) lançado(s)')+K('Custos',R(a.cost),P(a.rec?a.cost/a.rec*100:0)+' da receita')+K('Lucro',R(a.res),'',sem(a.m)[1])+K('Margem',P(a.m),sem(a.m)[0],sem(a.m)[1])+'</div>'+
      '<div class="two">'+PN('Receita, custos e lucro ('+RC+' meses)',gEvo(ms,[x]))+PN('Custos de '+ML(mes)+' por item',gCustos(t))+'</div>';
    if(r)h+='<h3>Demonstrativo de '+ML(mes)+'</h3><div class="tw dre"><table><tr><th>Item</th><th>Valor</th><th>% da receita</th></tr><tr><td><b>Receita</b></td><td><b>'+R(r.rec)+'</b></td><td>100%</td></tr>'+KS.filter(function(k){return n(c[k])||(k=='ft'&&r.ftq)}).map(function(k){return'<tr><td>(-) '+LB[k]+(k=='ft'&&r.ftq?' ('+r.ftq+' un.)':'')+'</td><td class="n">'+R(c[k])+'</td><td>'+(r.rec?P(n(c[k])/r.rec*100):'—')+'</td></tr>'}).join('')+'<tr class="t"><td>Resultado do contrato</td><td>'+R(r.res)+'</td><td>'+P(r.m)+'</td></tr></table></div>';
    return h+'</section>'}

  var _det=V.det,_dash=V.dash,_cont=V.cont;
  V.det=function(){var h=_det(),x=cur();if(!x)return h;
    h=h.replace('<h3>Lançamento mensal</h3><p class="sub">',detGraficos(x)+'<h3 class="np">Lançamento mensal</h3><p class="sub np">');
    return PH('Contrato · '+E(x.cliente),'Competência '+ML(mes)+' · '+E(x.emp||''))+h};
  V.dash=function(){var h=_dash(),w=CT.map(function(x){var r=calc(x);return r&&{id:x.id,nome:x.cliente||'',rec:r.rec,cost:r.cost,res:r.res,m:r.m}}).filter(Boolean);
    h=h.replace('Ver todos os alertas</button>','Ver todos os alertas</button><button class="b2" data-a="go" data-p="rel">Relatório e PDF</button>');
    if(w.length)h=h.replace('<div class="two"><div class="pn"><h3>Evolução mensal</h3>','<div class="two">'+PN('Lucro por contrato em '+ML(mes),gLucro(w))+'<div class="pn"><h3>Evolução mensal</h3>');
    return h};
  V.cont=function(){var h=_cont();
    h=h.replace('<th>Situação</th></tr>','<th>Situação</th><th></th></tr>').replace(/(<tr class="r" data-a="go" data-p="det:([^"]+)">[\s\S]*?)<\/tr>/g,'$1<td>'+'<button class="b2" data-a="pdfc" data-p="$2">PDF</button></td></tr>')
     .replace('>Novo contrato</button></div>','>Novo contrato</button><button class="b2" data-a="pdfall">PDF de todos os contratos</button></div>');
    return h};
  window.AXG={gEvo:gEvo,gLucro:gLucro,gCustos:gCustos,somar:somar,mesesN:mesesN,fk:fk,PH:PH,TIP:TIP,LEG:LEG};
  V.rel=rel;
  var i=NV.findIndex(function(q){return q[0]=='cont'});NV.splice(i+1,0,['rel','Rentabilidade e PDF']);
  var j=NVB.findIndex(function(q){return q[0]=='bcont'});NVB.splice(j+1,0,['rel','Rentabilidade e PDF']);

  /* ----- exportar PDF: usa "Salvar como PDF" do navegador, com layout próprio em A4 ----- */
  function aoSair(volta){window.addEventListener('afterprint',volta);try{var q=window.matchMedia('print');q.addEventListener('change',function f(e){if(!e.matches){volta();q.removeEventListener('change',f)}})}catch(e){}setTimeout(volta,120000)}
  CC.pdf=function(nome){var t=document.title,volta=function(){document.title=t};document.title=nome||'AXIS';aoSair(volta);window.print()};
  CC.pdfContratos=function(ids,nome){
    var l=ids.map(function(id){return CT0.find(function(x){return x.id==id})}).filter(Boolean);if(!l.length)return CC.toast('Nenhum contrato para exportar.','danger');
    var box=document.getElementById('pdfall');if(!box){box=document.createElement('div');box.id='pdfall';document.body.appendChild(box)}
    box.innerHTML=l.map(contratoRel).join('');document.body.classList.add('print-rep');
    var t=document.title,volta=function(){document.body.classList.remove('print-rep');box.innerHTML='';document.title=t};document.title=nome;aoSair(volta);window.print()};
  CC.pdfHtml=function(html,nome){var box=document.getElementById('pdfall');if(!box){box=document.createElement('div');box.id='pdfall';document.body.appendChild(box)}
    box.innerHTML=html;document.body.classList.add('print-rep');var t=document.title,volta=function(){document.body.classList.remove('print-rep');box.innerHTML='';document.title=t};document.title=nome;aoSair(volta);window.print()};
  document.addEventListener('click',function(e){var b=e.target.closest('[data-a="pdf"],[data-a="pdfc"],[data-a="pdfall"]');if(!b)return;var a=b.dataset.a;
    if(a=='pdf')CC.pdf(b.dataset.p);
    else if(a=='pdfc'){var x=CT0.find(function(q){return q.id==b.dataset.p});CC.pdfContratos([b.dataset.p],'AXIS-Contrato-'+String(x?x.cliente:'').replace(/[^\w\-]+/g,'_')+'-'+mes)}
    else CC.pdfContratos(CT.map(function(q){return q.id}),'AXIS-Contratos-'+mes)});
  document.addEventListener('change',function(e){if(e.target.id=='rp'){RP=+e.target.value||6;draw()}else if(e.target.id=='rc'){RC=+e.target.value||12;draw()}});

  /* ----- dicas flutuantes dos gráficos (mouse e toque) ----- */
  var tip=document.createElement('div');tip.id='axtip';tip.style.cssText='position:fixed;z-index:99999;pointer-events:none;display:none;background:#171a20;color:#fff;border:1px solid #c9a24a;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.35)';document.body.appendChild(tip);
  var tt=null,mostra=function(el,x,y){var l=(el.getAttribute('data-tip')||'').split('|');tip.innerHTML=l.map(function(s,k){return k?E(s):'<b>'+E(s)+'</b>'}).join('<br>');tip.style.display='block';

  var e=ES.ev.find(function(x){return x.codigo==o.evento_codigo})||{},h='<div class="crumb"><button data-a="eso" data-p="obrig">‹ Obrigações</button></div><h2>'+o.evento_codigo+' · '+E(o.evento_nome)+'</h2><p class="sub">'+E(nomeF(o))+' · '+E(o.empresa)+'</p>';
  h+='<div class="grid">'+kpi('Status',TG(STL[o.status]||[o.status,'mut']))+kpi('Prazo',TG(SM[o.semaforo]||['—','mut']))+kpi('Data limite',br(o.data_limite),'',e.prazo_confirmado?E(e.prazo_texto||''):'Regra a confirmar: informe a data manualmente')+kpi('Ocorrência',o.competencia?o.competencia.split('-').reverse().join('/'):br(o.data_ocorrencia))+
    kpi('Responsável',o.responsavel?E(ES.us[o.responsavel]||'Outro usuário'):'—')+'</div>';
  if(o.motivo_rejeicao)h+='<div class="alerts" style="margin-top:10px"><div class="al bad"><b>Motivo da rejeição:</b> '+E(o.motivo_rejeicao)+'</div></div>';
  h+='<h3>Observações</h3><div class="row"><input id="es_obs" style="flex:1;min-width:240px" value="'+E(o.observacao||'')+'"><button class="b2" data-a="eso" data-p="obs">Salvar</button><button class="b2" data-a="eso" data-p="assumir">Assumir acompanhamento</button></div>';
  if(!o.data_limite)h+='<div class="row"><label for="es_lim">Data limite:</label><input id="es_lim" type="date"><button class="b2" data-a="eso" data-p="lim">Definir</button></div>';
  h+='<h3>Registrar transmissão / retorno</h3><p class="sub">Use quando o envio foi feito fora do AXIS (portal do eSocial ou outro sistema). O evento só passa a “transmitido” ou “processado” com este registro.</p><div class="fm">'+
    '<div><label for="es_amb">Ambiente</label><select id="es_amb"><option value="externo">Portal / outro sistema</option><option value="producao">Produção</option><option value="producao_restrita">Produção restrita (teste)</option></select></div>'+
    '<div><label for="es_res">Resultado</label><select id="es_res"><option value="enviado">Enviado (aguardando)</option><option value="recebido">Recebido (protocolo)</option><option value="processado">Processado (recibo)</option><option value="rejeitado">Rejeitado</option></select></div>'+
    '<div><label for="es_prot">Protocolo</label><input id="es_prot"></div><div><label for="es_rec">Nº do recibo</label><input id="es_rec"></div><div style="grid-column:1/-1"><label for="es_msg">Mensagem / motivo da rejeição</label><input id="es_msg"></div></div>'+
    '<div class="row"><button class="b" data-a="eso" data-p="reg">Registrar</button><button class="b2" data-a="eso" data-p="st:gerado">Marcar XML gerado</button><button class="b2" data-a="eso" data-p="st:dispensado">Dispensar</button><button class="b2" data-a="eso" data-p="st:nao_aplicavel">Não aplicável</button><button class="b2" data-a="eso" data-p="st:pendente">Reabrir como pendente</button></div>';
  h+='<h3>Histórico de transmissões</h3>'+(ES.trSel.length?'<div class="tw"><table><tr><th>Quando</th><th>Etapa</th><th>Ambiente</th><th>Resultado</th><th>Protocolo / recibo</th><th>Mensagem</th></tr>'+ES.trSel.map(function(t){return '<tr><td>'+br(t.em)+' '+String(t.em).slice(11,16)+'</td><td>'+t.etapa+'</td><td>'+t.ambiente+'</td><td>'+t.resultado+'</td><td>'+E([t.protocolo,t.recibo].filter(Boolean).join(' / '))+'</td><td>'+E(t.mensagem||'')+'</td></tr>'}).join('')+'</table></div>':'<p class="sub">Nenhuma transmissão registrada. Esta obrigação não conta como enviada.</p>');
  return h}

/* ---------- Nova obrigação ---------- */
function nova(){var emps=[];FN0.forEach(function(f){if(f.emp&&emps.indexOf(f.emp)<0)emps.push(f.emp)});if(!emps.length)emps=window.EMPS||[];
  var fs=FN0.slice().sort(function(a,b){return String(a.nome).localeCompare(b.nome)});
  return '<div class="crumb"><button data-a="eso" data-p="obrig">‹ Obrigações</button></div><h2>Nova obrigação</h2><p class="sub">O prazo é calculado pelo evento. Para eventos “a confirmar”, informe a data limite.</p><div class="fm">'+
  '<div><label for="eo_ev">Evento</label><select id="eo_ev">'+ES.ev.map(function(e){return '<option value="'+e.codigo+'">'+e.codigo+' · '+E(e.nome)+'</option>'}).join('')+'</select></div>'+
  '<div><label for="eo_emp">Empresa</label><select id="eo_emp">'+emps.map(function(x){return '<option>'+E(x)+'</option>'}).join('')+'</select></div>'+
  '<div><label for="eo_func">Funcionário (vazio = empregador)</label><select id="eo_func"><option value="">—</option>'+fs.map(function(f){return '<option value="'+f.id+'">'+E(f.nome)+'</option>'}).join('')+'</select></div>'+
  '<div><label for="eo_comp">Competência (eventos periódicos)</label><input id="eo_comp" type="month"></div><div><label for="eo_dt">Data da ocorrência</label><input id="eo_dt" type="date"></div>'+
  '<div><label for="eo_lim">Data limite (opcional)</label><input id="eo_lim" type="date"></div><div><label for="eo_ac">Acidente de trabalho? (S-2230)</label><select id="eo_ac"><option value="0">Não</option><option value="1">Sim</option></select></div>'+
  '<div style="grid-column:1/-1"><label for="eo_obs">Observação</label><input id="eo_obs"></div></div><div class="row"><button class="b" data-a="eso" data-p="salvarnova">Salvar</button></div>'}

/* ---------- Catálogo ---------- */
function catalogo(){return '<div class="tw"><table><tr><th>Evento</th><th>Categoria</th><th>Periódico</th><th>Prazo</th><th>Regra</th></tr>'+ES.ev.map(function(e){var c=ES.cat.find(function(x){return x.id==e.categoria_id})||{};
  return '<tr><td>'+e.codigo+' · '+E(e.nome)+'</td><td>'+E(c.nome||'')+'</td><td>'+(e.periodico?'Sim':'Não')+'</td><td>'+E(e.prazo_texto||'')+'</td><td>'+TG(e.prazo_confirmado?['Confirmada','ok']:['A confirmar','warn'])+'</td></tr>'}).join('')+'</table></div><p class="sub">Leiaute: '+E((ES.ev[0]||{}).versao_leiaute||'S-1.3')+'. As regras “a confirmar” não geram data automática.</p>'}

/* ---------- Tela ---------- */
V.esoc=function(){if(!PEOK())return '<h2>eSocial</h2><p class="sub">Seu perfil não tem acesso a este módulo.</p>';
  if(!ES.loaded&&!ES.loading)load();
  var tabs=[['painel','Painel'],['obrig','Obrigações'],['catalogo','Catálogo']],t=ES.tab,hd='<h2>eSocial · Controle e auditoria</h2><p class="sub">Controle das obrigações. O AXIS só transmite a admissão (S-2200) pelo servidor; para os demais eventos, registre o recibo manualmente. Nada é contado como enviado sem registro de transmissão.</p>';
  hd+='<div class="row">'+tabs.map(function(x){return '<button class="'+(t==x[0]||(x[0]=='obrig'&&(t=='det'||t=='nova'))?'b':'b2')+'" data-a="eso" data-p="'+x[0]+'">'+x[1]+'</button>'}).join('')+'<button class="b2" data-a="eso" data-p="recarregar">Atualizar</button></div>';
  if(ES.err)return hd+'<div class="alerts"><div class="al bad">'+E(ES.err)+'</div></div>';
  if(ES.loading&&!ES.loaded)return hd+'<p class="sub">Carregando…</p>';
  return hd+(t=='painel'?painel():t=='obrig'?obrig():t=='det'?det():t=='nova'?nova():catalogo())};

/* ---------- Ações ---------- */
function fail(e){console.error(e);CC.toast('Não foi possível salvar: '+((e&&e.message)||e),'danger')}
async function upd(id,patch){var r=await sb().from('esocial_ocorrencias').update(patch).eq('id',id);if(r.error)throw r.error}
async function acao(p){var o=ES.oc.find(function(x){return x.id==ES.sel});
  try{
  if(p=='painel'||p=='obrig'||p=='catalogo'){ES.tab=p;draw();return}
  if(p=='recarregar'){await load();return}
  if(p=='nova'){ES.tab='nova';draw();return}
  if(p.indexOf('det:')==0){ES.sel=p.slice(4);ES.tab='det';ES.trSel=[];draw();loadTr(ES.sel);return}
  if(p=='salvarnova'){var ev=ES.ev.find(function(x){return x.codigo==val('eo_ev')}),row={evento_codigo:val('eo_ev'),empresa:val('eo_emp'),funcionario_id:val('eo_func')||null,competencia:val('eo_comp')||null,data_ocorrencia:val('eo_dt')||null,data_limite:val('eo_lim')||null,acidente:val('eo_ac')=='1',observacao:val('eo_obs')||null};
    if(!row.empresa)return CC.toast('Escolha a empresa.','danger');if(ev.periodico&&!row.competencia)return CC.toast('Este evento é periódico: informe a competência.','danger');if(!ev.periodico&&!row.data_ocorrencia)return CC.toast('Informe a data da ocorrência.','danger');
    var r=await sb().from('esocial_ocorrencias').insert(row);if(r.error)throw r.error;log('nova_obrigacao',{evento:row.evento_codigo});CC.toast('Obrigação cadastrada.','success');ES.tab='obrig';await load();return}
  if(p=='imp'){await importar();return}
  if(!o)return;
  if(p=='obs'){await upd(o.id,{observacao:val('es_obs')||null});CC.toast('Observação salva.','success')}
  else if(p=='assumir'){var u=await sb().auth.getUser();await upd(o.id,{responsavel:u.data.user.id});CC.toast('Você agora acompanha esta obrigação.','success')}
  else if(p=='lim'){if(!val('es_lim'))return CC.toast('Informe a data.','danger');await upd(o.id,{data_limite:val('es_lim')});CC.toast('Data limite definida.','success')}
  else if(p.indexOf('st:')==0){var s=p.slice(3);if((s=='dispensado'||s=='nao_aplicavel')&&!val('es_obs'))return CC.toast('Escreva a justificativa no campo Observações antes de dispensar.','danger');
    await upd(o.id,{status:s,observacao:val('es_obs')||o.observacao,motivo_rejeicao:null});log('status_'+s,{id:o.id});CC.toast('Status atualizado.','success')}
  else if(p=='reg'){var res=val('es_res'),amb=val('es_amb'),rec=val('es_rec'),msg=val('es_msg');
    if(res=='processado'&&!rec)return CC.toast('Para “processado”, informe o número do recibo.','danger');if(res=='rejeitado'&&!msg)return CC.toast('Para “rejeitado”, informe o motivo.','danger');
    var t=await sb().from('esocial_transmissoes').insert({ocorrencia_id:o.id,etapa:'manual',ambiente:amb,resultado:res,protocolo:val('es_prot')||null,recibo:rec||null,mensagem:msg||null}).select('id').single();if(t.error)throw t.error;
    if(rec){var rr=await sb().from('esocial_recibos').insert({ocorrencia_id:o.id,transmissao_id:t.data.id,nr_recibo:rec,protocolo:val('es_prot')||null,ambiente:amb,processado_em:res=='processado'?new Date().toISOString():null});if(rr.error)throw rr.error}
    await upd(o.id,{status:{enviado:'transmitido',recebido:'recebido',processado:'processado',rejeitado:'rejeitado'}[res],motivo_rejeicao:res=='rejeitado'?msg:null});log('registro_manual',{id:o.id,res:res});CC.toast('Registro salvo.','success')}
  await load();loadTr(o.id)}catch(e){fail(e)}}

/* Importa as admissões já controladas no cadastro (func.esocial). Só vira "processado" quem tem recibo. */
async function importar(){
  var ja={};ES.oc.filter(function(o){return o.evento_codigo=='S-2200'}).forEach(function(o){ja[o.funcionario_id]=1});
  var lim=new Date();lim.setDate(lim.getDate()-60);var limS=lim.toISOString().slice(0,10),novos=0,antigos=0,falhas=0;
  for(var i=0;i<FN0.length;i++){var f=FN0[i];if(ja[f.id]||!f.dtAdm||!f.emp)continue;var es=f.esocial||{},st=es.st||'pendente';
    if(st=='pendente'&&f.dtAdm<limS){antigos++;continue}
    try{var amb=/teste/i.test(es.amb||'')?'producao_restrita':'producao';
      var r=await sb().from('esocial_ocorrencias').insert({evento_codigo:'S-2200',empresa:f.emp,funcionario_id:f.id,data_ocorrencia:f.dtAdm,origem:'axis_func'}).select('id').single();if(r.error)throw r.error;
      var id=r.data.id,novo='pendente',rs={enviado:'enviado',processado:'processado',rejeitado:'rejeitado',erro:'erro'}[st];
      if(rs){var t=await sb().from('esocial_transmissoes').insert({ocorrencia_id:id,etapa:'envio',ambiente:amb,resultado:rs,protocolo:es.prot||null,recibo:es.rec||null,mensagem:(es.msgs||[]).join(' | ').slice(0,1000)||null,em:es.at||new Date().toISOString()}).select('id').single();if(t.error)throw t.error;
        if(st=='processado'&&es.rec){var rc=await sb().from('esocial_recibos').insert({ocorrencia_id:id,transmissao_id:t.data.id,nr_recibo:es.rec,protocolo:es.prot||null,ambiente:amb});if(rc.error)throw rc.error;novo='processado'}
        else if(st=='processado')novo='recebido';else if(st=='enviado')novo='transmitido';else if(st=='rejeitado')novo='rejeitado'}
      if(novo!='pendente')await upd(id,{status:novo,motivo_rejeicao:novo=='rejeitado'?((es.msgs||[])[0]||'Rejeitada pelo eSocial'):null});
      novos++}catch(e){console.error(e);falhas++}}
  log('importar_cadastro',{novos:novos,antigos:antigos,falhas:falhas});
  CC.toast(novos+' admissão(ões) importada(s)'+(antigos?'; '+antigos+' antiga(s) sem envio pelo AXIS não importada(s) — se já estão no eSocial, cadastre o recibo manualmente':'')+(falhas?'; '+falhas+' falha(s)':'')+'.',falhas?'danger':'success');
  await load()}

var ir=NV.findIndex(function(q){return q[0]=='fun'});NV.splice(ir+1,0,['esoc','eSocial']);
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-a="eso"]');if(b)acao(b.dataset.p)});
document.addEventListener('input',function(e){if(e.target.id=='es_q'){ES.f.q=e.target.value;var p=e.target.selectionStart;draw();var n=$e('es_q');if(n){n.focus();n.setSelectionRange(p,p)}}});
document.addEventListener('change',function(e){var m={es_st:'st',es_ev:'ev',es_sm:'sm'}[e.target.id];if(m){ES.f[m]=e.target.value;draw()}});
})();
</script>
